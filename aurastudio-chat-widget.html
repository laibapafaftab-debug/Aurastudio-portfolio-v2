<!-- ===== AuraStudio chat widget: paste this whole block just before </body> ===== -->
<style>
  #asw{--bg:#0d1526;--surface:#152238;--text:#eef1f6;--dim:#8b96ac;--accent:#4fd1c5;--accent-ink:#06231f;--gold:#d4a24c;--line:rgba(255,255,255,.12);
    position:fixed;right:20px;bottom:20px;z-index:99999;font-family:inherit}
  #asw *{box-sizing:border-box}
  #asw .fab{width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  #asw .panel{position:absolute;right:0;bottom:72px;width:370px;max-width:calc(100vw - 32px);background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);display:none;flex-direction:column}
  #asw.open .panel{display:flex}
  #asw .top{padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  #asw .top b{font-size:14px}
  #asw .top small{display:block;color:var(--accent);font-size:11.5px}
  #asw .x{margin-left:auto;background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
  #asw .modes{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
  #asw .modes button{flex:1;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 4px;font:inherit;font-size:12px;cursor:pointer}
  #asw .modes button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  #asw .log{height:300px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  #asw .m{max-width:84%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
  #asw .m.u{align-self:flex-end;background:rgba(79,209,197,.16);border-color:rgba(79,209,197,.3)}
  #asw .m.ok{border-color:var(--gold)}
  #asw .q{display:flex;flex-wrap:wrap;gap:6px}
  #asw .q button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}
  #asw .q button:hover{border-color:var(--accent);color:var(--accent)}
  #asw .in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
  #asw .in input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 12px;font:inherit;font-size:14px;outline:none}
  #asw .in button{width:38px;border:none;border-radius:9px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:15px}
  #asw button:focus-visible,#asw input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (max-width:480px){#asw{right:12px;bottom:12px}}
</style>

<div id="asw">
  <div class="panel" role="dialog" aria-label="AuraStudio chat">
    <div class="top"><div><b id="aswName">AuraStudio Assistant</b><small>Online now</small></div><button class="x" id="aswClose" aria-label="Close chat">×</button></div>
    <div class="modes" role="group" aria-label="Chat mode">
      <button data-m="as" aria-pressed="true">AuraStudio</button>
      <button data-m="re" aria-pressed="false">Real estate demo</button>
      <button data-m="cl" aria-pressed="false">Clinic demo</button>
    </div>
    <div class="log" id="aswLog" aria-live="polite"></div>
    <div class="in"><input id="aswIn" type="text" placeholder="Type a message…" autocomplete="off" aria-label="Message"><button id="aswSend" aria-label="Send">➤</button></div>
  </div>
  <button class="fab" id="aswFab" aria-label="Open chat">💬</button>
</div>

<script>
(function () {
  // Optional: paste your n8n / Zapier / Make webhook URL here to receive every captured lead.
  var WEBHOOK_URL = '';

  var BOTS = {
    as: { name: 'AuraStudio Assistant',
      hi: "Hi! I'm the AuraStudio assistant. Ask about our services, timelines or pricing, or book a free technical audit.",
      quick: [['What do you build?', 'What do you build?'], ['Timelines', 'How long does it take?'], ['Pricing', 'How much does it cost?'], ['Book an audit', 'Book a technical audit']],
      rules: [
        { k: ['build', 'service', 'services', 'offer', 'do'], r: "We build web apps (Next.js, React), AI and API integrations (Python, FastAPI, Gemini) and automated lead pipelines (n8n). Want a free technical audit? What's your name?", lead: 1 },
        { k: ['long', 'timeline', 'time', 'days', 'deadline', 'fast'], r: "Simple automations ship in 48 hours. Larger builds get a fixed, scoped timeline before any code is written. Share your name and Laiba will confirm a date for your project.", lead: 1 },
        { k: ['price', 'pricing', 'cost', 'budget', 'much', 'quote'], r: "Every project gets a fixed price after a short scope call, with no agency overhead. What's your name so we can prepare a quote?", lead: 1 },
        { k: ['book', 'audit', 'call', 'meeting', 'human', 'contact', 'talk'], r: "Happy to set that up. What's your name?", lead: 1 }] },
    re: { name: 'Property Assistant',
      hi: "Demo: real estate bot. Ask about listings, prices or booking a visit.",
      quick: [['Properties', 'Show available properties'], ['Pricing', 'What are your prices?'], ['Book a visit', 'I want to book a visit']],
      rules: [
        { k: ['propert', 'listing', 'house', 'flat', 'apartment', 'available'], r: "We have 3 live listings: a 2-bed apartment in DHA (PKR 45,000/mo), a family house in Bahria Town and a studio near Gulberg. What's your name so an agent can send details?", lead: 1 },
        { k: ['price', 'pricing', 'cost', 'much', 'rate'], r: "Apartments start around PKR 35,000/mo, houses from PKR 80,000/mo. What's your name for an exact quote?", lead: 1 },
        { k: ['book', 'visit', 'appointment', 'tour', 'viewing', 'human', 'agent'], r: "Great, I can arrange that. What's your name?", lead: 1 }] },
    cl: { name: 'Clinic Assistant',
      hi: "Demo: clinic bot. Ask about appointments, doctors or fees.",
      quick: [['Book appointment', 'I want to book an appointment'], ['Doctors', 'Which doctors are available?'], ['Fees', 'What are the fees?']],
      rules: [
        { k: ['book', 'appointment', 'schedule', 'checkup', 'human', 'receptionist'], r: "I can book that. What's your name?", lead: 1 },
        { k: ['doctor', 'specialist', 'dentist', 'available'], r: "We have a General Physician, a Dentist and a Dermatologist, Mon–Sat, 10am–8pm. What's your name so I can reserve a slot?", lead: 1 },
        { k: ['fee', 'fees', 'price', 'cost', 'much', 'charges'], r: "Consultations start at PKR 1,500 and specialist visits at PKR 3,000. Want me to book one? What's your name?", lead: 1 }] }
  };
  var SMALL = [{ k: ['hi', 'hello', 'hey', 'salam', 'assalam'], r: 'Hello! 👋 How can I help?' }, { k: ['thanks', 'thank', 'shukriya'], r: "You're welcome!" }];
  var FALLBACK = 'Thanks! Pick an option below, or share your name and a teammate will follow up.';

  var root = document.getElementById('asw'), log = document.getElementById('aswLog'), input = document.getElementById('aswIn');
  var mode = 'as', stage = null, cur = {}, busy = false;

  function hit(t, keys) {
    var w = t.toLowerCase().match(/[a-z0-9']+/g) || [], j = ' ' + w.join(' ') + ' ';
    return keys.some(function (k) { return k.length > 4 ? j.indexOf(k) > -1 : w.indexOf(k) > -1; });
  }
  function msg(text, cls) { var d = document.createElement('div'); d.className = 'm ' + (cls || ''); d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; }
  function quick() {
    var q = document.createElement('div'); q.className = 'q'; q.id = 'aswQ';
    BOTS[mode].quick.forEach(function (p) { var b = document.createElement('button'); b.textContent = p[0]; b.onclick = function () { send(p[1]); }; q.appendChild(b); });
    log.appendChild(q); log.scrollTop = log.scrollHeight;
  }
  function reset() {
    log.innerHTML = ''; stage = null; cur = {}; busy = false;
    document.getElementById('aswName').textContent = BOTS[mode].name;
    msg(BOTS[mode].hi); quick();
  }
  function saveLead(l) {
    if (!WEBHOOK_URL) return;
    try { fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(l) }); } catch (e) {}
  }
  function answer(t) {
    t = t.trim();
    if (stage === 'name') { cur.name = t; stage = 'phone'; return ['Thanks, ' + t + '! What is your phone, WhatsApp or email so we can follow up?']; }
    if (stage === 'phone') {
      var ok = /\d{7,}/.test(t.replace(/[\s\-+()]/g, '')) || /^\S+@\S+\.\S+$/.test(t);
      if (!ok) return ['That does not look like a valid phone number or email. Please try again.'];
      cur.contact = t; stage = null;
      saveLead({ name: cur.name, contact: cur.contact, topic: cur.topic, bot: mode, page: location.href, time: new Date().toISOString() });
      var done = "You're all set ✅ We'll contact " + cur.name + " within 24 hours."; cur = {};
      return [done, 'ok'];
    }
    var rules = BOTS[mode].rules;
    for (var i = 0; i < rules.length; i++) if (hit(t, rules[i].k)) { stage = 'name'; cur = { topic: t }; return [rules[i].r]; }
    for (var j = 0; j < SMALL.length; j++) if (hit(t, SMALL[j].k)) return [SMALL[j].r];
    return [FALLBACK, 'q'];
  }
  function send(t) {
    if (!t.trim() || busy) return; busy = true;
    msg(t, 'u'); input.value = ''; var q = document.getElementById('aswQ'); if (q) q.remove();
    setTimeout(function () { var a = answer(t); msg(a[0], a[1] === 'ok' ? 'ok' : ''); if (a[1] === 'q') quick(); busy = false; }, 550);
  }
  function toggle(open) { root.classList.toggle('open', open); if (open) { if (!log.children.length) reset(); input.focus(); } }

  document.getElementById('aswFab').onclick = function () { toggle(!root.classList.contains('open')); };
  document.getElementById('aswClose').onclick = function () { toggle(false); };
  document.getElementById('aswSend').onclick = function () { send(input.value); };
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(input.value); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggle(false); });
  root.querySelectorAll('.modes button').forEach(function (b) {
    b.onclick = function () { mode = b.dataset.m; root.querySelectorAll('.modes button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); reset(); };
  });
})();
</script>
<!-- ===== end of AuraStudio chat widget ===== -->
